name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One queue per ref, so a push to another branch cannot replace a pending deploy of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # onnxruntime-node's install script downloads a native binary that only the
      # offline Node probe needs; the browser app uses the WASM build.
      - run: npm ci --ignore-scripts
      - uses: astral-sh/setup-uv@v6
      # `npm run check` runs ruff through `uv run --offline`, so fill the uv cache first.
      - run: uv sync --cache-dir .cache/uv
      # ESLint, size budgets, ruff check and ruff format --check, as AGENTS.md documents.
      - run: npm run check
      - run: npm test
      # The sentence models come from the pinned `models-v1` release, not Hugging Face. The repository is
      # private, so `gh` authenticates with the workflow's own token (no personal token is needed); the
      # download is cached by the hashes in scripts/model-release.json.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/model-release
            .cache/data-release/downloads
          key: releases-${{ hashFiles('scripts/model-release.json', 'scripts/data-release.json') }}
      - run: node scripts/prepare_assets.mjs --model
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_RELEASE_REQUIRED: '1'
          DATA_RELEASE_REQUIRED: '1'
      - name: Build for the project site path
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run check:bundle
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Branch pushes only build and check; deploy stays limited to main (or a manual run).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
