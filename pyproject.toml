[project]
name = "data-explorer-analysis"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff==0.14.1"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules", "dist", "vendor", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "C90", "PLR", "RUF"]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 8
max-statements = 35
max-returns = 4

[tool.ruff.format]
docstring-code-format = true
